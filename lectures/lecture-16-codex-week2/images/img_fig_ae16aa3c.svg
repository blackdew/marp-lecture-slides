
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-label="맥락을 길게 적어주면 에이전트는 그 범위 안에서만 생각하지만, 짧게 주고 질문을 받으면 내가 정하지 않은 것이 드러난다">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#13735F"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--acc)"/></marker></defs>
<text x="0" y="16" fill="#13735F" font-size="12" font-weight="600" opacity=".55" letter-spacing="2">맥락을 다 적어주기</text>
<rect x="0" y="34" width="250" height="92" rx="8" stroke="#13735F" fill="none" stroke-width="1.5" opacity=".7"/>
<text x="125" y="62" text-anchor="middle" fill="#13735F" font-size="13.5" font-weight="600">내가 아는 것 전부</text>
<text x="125" y="84" text-anchor="middle" fill="#13735F" font-size="12" opacity=".6">배경 · 형식 · 참고 · 금지</text>
<text x="125" y="106" text-anchor="middle" fill="#13735F" font-size="12" opacity=".6">적다가 지칩니다</text>
<line x1="250" y1="80" x2="312" y2="80" stroke="#13735F" stroke-width="1.5" opacity=".8" marker-end="url(#ar)"/>
<rect x="316" y="34" width="250" height="92" rx="8" stroke="#13735F" fill="none" stroke-width="1.5" opacity=".7" stroke-dasharray="5 4"/>
<text x="441" y="70" text-anchor="middle" fill="#13735F" font-size="13.5">적어준 범위 안에서만</text>
<text x="441" y="94" text-anchor="middle" fill="#13735F" font-size="13.5">생각합니다</text>
<text x="590" y="66" fill="#13735F" font-size="12.5" opacity=".65">더 좋은 방법을 제안하지 않습니다</text>
<text x="590" y="94" fill="#13735F" font-size="12.5" opacity=".65">안 적은 전제가 사고를 냅니다</text>

<line x1="0" y1="152" x2="960" y2="152" stroke="#13735F" opacity=".18"/>

<text x="0" y="184" font-size="12" font-weight="600" letter-spacing="2" style="fill:var(--acc)">짧게 주고 질문 받기</text>
<rect x="0" y="202" width="180" height="56" rx="8" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.5"/>
<text x="90" y="236" text-anchor="middle" font-size="13.5" font-weight="600" style="fill:var(--acc)">한 줄 + 질문권</text>
<path d="M180 218 L 300 218" style="stroke:var(--acc)" stroke-width="1.5" marker-end="url(#ara)"/>
<text x="240" y="210" text-anchor="middle" fill="#13735F" font-size="11.5" opacity=".7">무엇을 하려는지</text>
<path d="M300 244 L 180 244" style="stroke:var(--acc)" stroke-width="1.5" marker-end="url(#ara)"/>
<text x="240" y="262" text-anchor="middle" fill="#13735F" font-size="11.5" opacity=".7">질문 3개</text>
<rect x="304" y="202" width="180" height="56" rx="8" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.5"/>
<text x="394" y="236" text-anchor="middle" font-size="13.5" font-weight="600" style="fill:var(--acc)">에이전트</text>
<text x="394" y="186" text-anchor="middle" fill="#13735F" font-size="11.5" opacity=".65">3~5회 주고받음</text>
<line x1="484" y1="230" x2="546" y2="230" style="stroke:var(--acc)" stroke-width="1.5" marker-end="url(#ara)"/>
<rect x="550" y="202" width="410" height="56" rx="8" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.5"/>
<text x="755" y="226" text-anchor="middle" font-size="13.5" font-weight="600" style="fill:var(--acc)">“아, 나 이걸 안 정했네”</text>
<text x="755" y="247" text-anchor="middle" fill="#13735F" font-size="12" opacity=".7">에이전트가 하는 질문이 내가 안 정한 부분을 드러냅니다</text>
<text x="0" y="300" fill="#13735F" font-size="12.5" opacity=".6">맥락을 전부 적어주려 하지 말고, 에이전트가 맥락으로 다가오게 만드세요.</text>
</svg>