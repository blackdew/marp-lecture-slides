
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" role="img" aria-label="지금까지의 말 뒤에 올 단어의 확률을 계산해 하나를 고르고 뒤에 붙이는 과정을 반복한다">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#13735F"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--acc)"/></marker></defs>
<text x="0" y="14" fill="#13735F" font-size="12" font-weight="600" opacity=".55" letter-spacing="2">지금까지의 말</text>
<rect x="0" y="30" width="86" height="38" rx="5" stroke="#13735F" fill="none" stroke-width="1.4" opacity=".7"/>
<text x="43" y="55" text-anchor="middle" fill="#13735F" font-size="15">오늘</text>
<rect x="92" y="30" width="86" height="38" rx="5" stroke="#13735F" fill="none" stroke-width="1.4" opacity=".7"/>
<text x="135" y="55" text-anchor="middle" fill="#13735F" font-size="15">서울</text>
<rect x="184" y="30" width="86" height="38" rx="5" stroke="#13735F" fill="none" stroke-width="1.4" opacity=".7"/>
<text x="227" y="55" text-anchor="middle" fill="#13735F" font-size="15">날씨는</text>
<rect x="276" y="30" width="62" height="38" rx="5" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="307" y="56" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--acc)">?</text>

<path d="M307 68 L 307 100" style="stroke:var(--acc)" stroke-width="1.5" marker-end="url(#ara)"/>

<rect x="90" y="106" width="434" height="142" rx="8" stroke="#13735F" fill="none" stroke-width="1.5" opacity=".75"/>
<text x="110" y="130" fill="#13735F" font-size="12.5" font-weight="600" opacity=".7">다음에 올 말의 확률</text>
<text x="110" y="162" fill="#13735F" font-size="14">맑습니다</text>
<rect x="210" y="149" width="186" height="16" rx="3" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.2"/>
<text x="410" y="162" font-size="13" font-weight="600" style="fill:var(--acc)">62%</text>
<text x="110" y="196" fill="#13735F" font-size="14" opacity=".8">흐립니다</text>
<rect x="210" y="183" width="63" height="16" rx="3" stroke="#13735F" fill="none" stroke-width="1.2" opacity=".6"/>
<text x="410" y="196" fill="#13735F" font-size="13" opacity=".65">21%</text>
<text x="110" y="230" fill="#13735F" font-size="14" opacity=".8">춥습니다</text>
<rect x="210" y="217" width="27" height="16" rx="3" stroke="#13735F" fill="none" stroke-width="1.2" opacity=".6"/>
<text x="410" y="230" fill="#13735F" font-size="13" opacity=".65">9%</text>

<line x1="524" y1="177" x2="586" y2="177" style="stroke:var(--acc)" stroke-width="1.5" marker-end="url(#ara)"/>
<text x="555" y="167" text-anchor="middle" fill="#13735F" font-size="11.5" opacity=".7">하나를 고름</text>
<rect x="590" y="149" width="170" height="56" rx="8" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.5"/>
<text x="675" y="183" text-anchor="middle" font-size="15" font-weight="600" style="fill:var(--acc)">맑습니다</text>
<path d="M760 160 C 860 110, 880 60, 360 49" fill="none" style="stroke:var(--acc)" stroke-width="1.5" opacity=".75" stroke-dasharray="6 5" marker-end="url(#ara)"/>
<text x="810" y="108" text-anchor="middle" fill="#13735F" font-size="11.5" opacity=".7">뒤에 붙이고 다시</text>

<text x="0" y="286" fill="#13735F" font-size="12.5" opacity=".62">문장 전체를 미리 계획하고 쓰는 것이 아닙니다. 낱말 하나를 고르고, 그 낱말까지 포함해 다음을 다시 고릅니다.</text>
</svg>