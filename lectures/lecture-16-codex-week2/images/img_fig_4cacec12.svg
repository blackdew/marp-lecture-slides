
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="컨텍스트를 받아 추론하고 도구로 실제 작업을 하고 결과를 확인해 안 됐으면 다시 반복하는 구조">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#13735F"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--acc)"/></marker></defs>
<rect x="0" y="54" width="152" height="62" rx="8" stroke="#13735F" fill="none" stroke-width="1.5" opacity=".75"/><text x="76" y="83" text-anchor="middle" fill="#13735F" font-size="15" font-weight="600">컨텍스트</text><text x="76" y="101" text-anchor="middle" fill="#13735F" font-size="12" opacity=".6">내가 준 말 + 읽은 파일</text>
<line x1="152" y1="85" x2="206" y2="85" stroke="#13735F" stroke-width="1.5" opacity=".8" marker-end="url(#ar)"/>
<rect x="210" y="54" width="142" height="62" rx="8" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.5" opacity="1"/><text x="281" y="83" text-anchor="middle" fill="#13735F" font-size="15" font-weight="600">추론</text><text x="281" y="101" text-anchor="middle" fill="#13735F" font-size="12" opacity=".6">다음 말을 고름</text>
<line x1="352" y1="85" x2="406" y2="85" style="stroke:var(--acc)" stroke-width="1.5" opacity=".8" marker-end="url(#ara)"/>
<rect x="410" y="54" width="168" height="62" rx="8" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.5" opacity="1"/><text x="494" y="83" text-anchor="middle" fill="#13735F" font-size="15" font-weight="600">도구</text><text x="494" y="101" text-anchor="middle" fill="#13735F" font-size="12" opacity=".6">파일 읽기·쓰기·실행</text>
<line x1="578" y1="85" x2="632" y2="85" style="stroke:var(--acc)" stroke-width="1.5" opacity=".8" marker-end="url(#ara)"/>
<rect x="636" y="54" width="152" height="62" rx="8" stroke="#13735F" fill="none" stroke-width="1.5" opacity=".75"/><text x="712" y="90" text-anchor="middle" fill="#13735F" font-size="15" font-weight="600">결과 확인</text>
<line x1="788" y1="85" x2="842" y2="85" stroke="#13735F" stroke-width="1.5" opacity=".8" marker-end="url(#ar)"/>
<rect x="846" y="54" width="114" height="62" rx="8" style="stroke:var(--acc);fill:var(--acc);fill-opacity:.1" stroke-width="1.5"/>
<text x="903" y="92" text-anchor="middle" font-size="15" font-weight="600" style="fill:var(--acc)">끝</text>
<path d="M712 116 C 712 186, 76 196, 76 122" fill="none" stroke="#13735F" stroke-width="1.5" opacity=".45" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="394" y="192" text-anchor="middle" fill="#13735F" font-size="12.5" opacity=".7">안 됐으면 스스로 다시 — 1강에서 화면으로 본 그 반복</text>
<text x="0" y="22" fill="#13735F" font-size="12" font-weight="600" opacity=".55" letter-spacing="2">에이전트 = 추론 + 도구 + 반복</text>
<text x="0" y="240" fill="#13735F" font-size="12.5" opacity=".62">챗봇은 가운데 칸까지입니다. 도구와 반복이 붙으면 말이 아니라 결과물이 남습니다.</text>
</svg>