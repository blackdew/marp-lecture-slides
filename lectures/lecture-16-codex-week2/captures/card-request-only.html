    .landscape {
      background-image:
        linear-gradient(180deg, #090e19aa 0%, #10182836 36%, #10172508 65%, #090e19a8 100%),
        var(--winter-photo),
        radial-gradient(ellipse at 50% 72%, #354255, transparent 63%);
      background-size: cover;
      background-position: center, center 66%, center;
    }
    .snow i {
      position: absolute;
      top: 0;
      left: var(--x);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #fff4d9;
      box-shadow: 0 0 7px #ffebba5c;
      opacity: var(--opacity);
      animation: snowfall var(--time) var(--delay) linear infinite;
    }
    @keyframes snowfall {
      from { transform: translate3d(0, -6vh, 0); }
      to { transform: translate3d(var(--drift), 107vh, 0); }
    }
    .snow[data-paused="true"] i { animation-play-state: paused; }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid #f7c878; outline-offset: 5px; }
    .site-header, .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-inline: clamp(20px, 5vw, 80px);
    }
    .site-header {
      min-height: 76px;
      border-bottom: 1px solid #f9e1b434;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: .9rem; }
    .brand-mark { color: var(--gold); font-size: 1.45rem; }
    .site-footer { min-height: 68px; }
    .quiet-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid #ffe8bc50;
      border-radius: 4px;
      color: var(--ivory);
      background: #0f1726b0;
      font-size: .875rem;
    }
    .quiet-button:hover { background: #2a3443; border-color: #ffe8bc9c; }
    .quiet-button .icon { color: var(--gold); }
    .footer-dedication {
      margin: 0;
      color: var(--muted);
      font-size: .875rem;
      letter-spacing: .075em;
    }

    .stage {
      width: min(100%, 1000px);
      margin: auto;
      padding: clamp(32px, 6.3vh, 72px) 22px clamp(20px, 4.5vh, 54px);
      text-align: center;
    }
    .season {
      margin: 0 0 18px;
      color: var(--gold);
      letter-spacing: .22em;
      font-size: .875rem;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2rem, 6vw, 4.45rem);
      letter-spacing: -.065em;
      line-height: 1.18;
      text-wrap: balance;
      word-break: keep-all;
      text-shadow: 0 3px 32px #05090f9c;
    }
    .hero-detail {
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
      word-break: keep-all;
    }
    .mail {
      width: min(100%, 446px);
      margin: clamp(26px, 5.3vh, 52px) auto 0;
    }
    .opener {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 22px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
    }
    .envelope {
      position: relative;
      isolation: isolate;
      width: 100%;
      aspect-ratio: 2.02 / 1;
      display: block;
      border: 1px solid #f8e7c2;
      border-radius: 4px;
      background: #eddbb5;
      box-shadow: 0 17px 48px #02060cb5;
      transition: transform .24s ease, box-shadow .24s ease;
      overflow: hidden;
    }
    .opener:hover .envelope { transform: translateY(-5px) rotate(-.6deg); box-shadow: 0 24px 60px #02060ce0; }
    .envelope::before, .envelope::after, .flap {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .envelope::before {
      background: linear-gradient(125deg, #f8e8c5, #d8bd8b);
      clip-path: polygon(0 0, 59% 63%, 0 100%);
    }
    .envelope::after {
      background: linear-gradient(227deg, #f6e6c4, #d9bd8a);
      clip-path: polygon(100% 0, 42% 63%, 100% 100%);
    }
    .flap {
      z-index: 1;
      filter: drop-shadow(0 3px 4px #64431e50);
    }
    .flap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(166deg, #faf0d6, #e4cea0 74%);
      clip-path: polygon(0 0, 100% 0, 52% 65%, 48% 65%);
    }
    .paper-grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: .58;
      background-image: repeating-linear-gradient(111deg, #674d3511 0 1px, transparent 1px 4px);
      pointer-events: none;
    }
    .seal {
      position: absolute;
      z-index: 3;
      top: 62%;
      left: 50%;
      display: grid;
      place-items: center;
      width: clamp(46px, 10vw, 59px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) rotate(-8deg);
      color: #f7d1a2;
      background: radial-gradient(circle at 32% 22%, #a25c54, #78312e 58%, #5c2527);
      border: 1px solid #c28169;
      border-radius: 46% 50% 45% 49%;
      box-shadow: 1px 5px 8px #56301e75, inset 0 0 0 4px #6c2e2177;
      font-size: 1.9rem;
    }
    .seal::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid #f1b18b81;
      border-radius: 50%;
    }
    .envelope-recipient {
      position: absolute;
      z-index: 3;
      bottom: 8%;
      inset-inline: 9%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: var(--serif);
      font-size: .875rem;
    }
    .gold-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 23px;
      border: 1px solid #fae3b6;
      border-radius: 4px;
      background: #e9c888;
      color: #2e2117;
      font-size: .95rem;
      font-weight: 650;
    }
    .gold-button:hover, .opener:hover .gold-button { background: #f5d99e; }

    .letter {
      position: relative;
      width: min(100%, 590px);
      margin: 0 auto;
      padding: clamp(32px, 6vw, 57px) clamp(24px, 6vw, 65px);
      color: var(--ink);
      border: 1px solid #f9e8bf;
      border-radius: 3px;
      background:
        repeating-linear-gradient(109deg, #775b3507 0 1px, transparent 1px 5px),
        linear-gradient(120deg, #fff4dc, var(--paper));
      box-shadow: 0 22px 75px #04060ca8;
      text-align: left;
    }
    .letter::after {
      position: absolute;
      content: "";
      inset: 11px;
      border: 1px solid #9d734048;
      pointer-events: none;
    }
    .letter:not([hidden]) { animation: unfold .57s cubic-bezier(.18, .8, .26, 1) both; }
    @keyframes unfold {
      from { opacity: .2; transform: perspective(850px) rotateX(-22deg) translateY(24px) scale(.96); }
      to { opacity: 1; transform: none; }
    }
    .letter-star { display: block; margin: 0 0 20px; color: #8a5039; font-size: 1.65rem; }
    .recipient {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.3rem, 4.9vw, 1.7rem);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .letter-body {
      margin: 20px 0 28px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: keep-all;
      font-size: 1.025rem;
      line-height: 1.9;
    }
    .sender {
      margin: 0;
      text-align: right;
      overflow-wrap: anywhere;
      font-family: var(--serif);
      font-size: 1.06rem;
    }
    .letter-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    .dialog {
      color-scheme: light;
      width: min(calc(100% - 28px), 510px);
      max-height: calc(100% - 24px);
      border: 1px solid #e3c99a;
      border-radius: 5px;
      background: #fff4df;
      padding: clamp(20px, 5vw, 34px);
      color: var(--ink);
      box-shadow: 0 26px 80px #03050a96;
    }
    .dialog::backdrop { background: #080d19ca; }
    .dialog h2 { margin: 0 0 22px; font-family: var(--serif); font-size: 1.65rem; }
    .field { display: grid; gap: 6px; margin-bottom: 15px; font-size: .9375rem; }
    .field input, .field textarea {
      width: 100%;
      padding: 10px 11px;
      color: var(--ink);
      border: 1px solid #b49b76;
      border-radius: 3px;
      background: #fffaf0;
      font-size: 1rem;
    }
    .field textarea { resize: vertical; line-height: 1.5; min-height: 105px; }
    .dialog :focus-visible { outline-color: #883f33; outline-offset: 2px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 19px; }
    .cancel-button { color: var(--ink); background: transparent; border-color: #b49b76; }
    .cancel-button:hover { background: #f4e4c8; border-color: #8e7350; }
    .screen-reader {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @media (max-width: 560px) {
      .site-header { min-height: 64px; }
      .site-footer { min-height: 61px; gap: 8px; }
      .footer-dedication { letter-spacing: 0; }
      .landscape { background-position: center, 87% bottom, center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .snow { display: none; }
      #snow-button { display: none; }
      .site-footer { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="landscape" aria-hidden="true"></div>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <header class="site-header">
    <span class="brand"><span class="brand-mark" aria-hidden="true">✧</span> 연말 인사 카드</span>
    <button class="quiet-button" id="edit-button" type="button">
      <span class="icon" aria-hidden="true">✎</span> 카드 꾸미기
    </button>
  </header>

  <main class="stage">
    <section id="cover" aria-labelledby="cover-title">
      <p class="season">2026년을 보내며</p>
      <h1 id="cover-title">올 한 해, 함께해 주셔서<br>고맙습니다.</h1>
      <p class="hero-detail">한 해의 끝에서, 고마운 마음을 전합니다.</p>

      <div class="mail">
        <button class="opener" id="open-button" type="button" aria-label="편지 열기" aria-controls="inside">
          <span class="envelope" aria-hidden="true">
            <span class="flap"></span>
            <span class="paper-grain"></span>
            <span class="seal">✧</span>
            <span class="envelope-recipient" id="envelope-recipient"></span>
          </span>
          <span class="gold-button">편지 열기</span>
        </button>
      </div>
    </section>

    <section id="inside" aria-label="연말 편지" hidden>
      <article id="letter" class="letter" aria-labelledby="recipient" tabindex="-1">
        <span class="letter-star" aria-hidden="true">✧</span>
        <h2 class="recipient" id="recipient"></h2>
        <p class="letter-body" id="letter-body"></p>
        <p class="sender" id="sender"></p>
      </article>
      <div class="letter-actions">
        <button class="quiet-button" id="close-button" type="button">편지 접기</button>
        <button class="quiet-button" id="download-button" type="button">카드 파일 저장</button>
      </div>
    </section>
    <p class="screen-reader" id="status" role="status"></p>
  </main>

  <footer class="site-footer">
    <button class="quiet-button" id="snow-button" type="button">
      <span class="icon" aria-hidden="true">❄</span><span id="snow-label">눈 멈추기</span>
    </button>
    <p class="footer-dedication">따뜻한 연말 보내세요</p>
  </footer>

  <dialog class="dialog" id="editor" aria-labelledby="editor-title">
    <form method="dialog" id="editor-form">
      <h2 id="editor-title">카드 꾸미기</h2>
      <label class="field">
        받는 분
        <input name="recipient" maxlength="32" placeholder="소중한 당신" autocomplete="off" autofocus>
      </label>
      <label class="field">
        보내는 분
        <input name="sender" maxlength="32" placeholder="고마운 마음을 담아" autocomplete="off">
      </label>
      <label class="field">
        인사말
        <textarea name="message" rows="5" maxlength="600" required></textarea>
      </label>
      <div class="dialog-actions">
        <button class="quiet-button cancel-button" id="cancel-button" type="button">취소</button>
        <button class="gold-button" type="submit">카드에 적용</button>
      </div>
    </form>
  </dialog>

  <script type="application/json" id="card-data">
    {
      "recipient": "",
      "sender": "",
      "message": "돌아보면 마음에 남는 순간마다 당신이 있었습니다. 올해를 함께 걸어 주어서 고마워요.\n\n한 해의 마지막 밤은 따뜻하고 편안하기를, 다가오는 2027년에는 자주 웃을 수 있기를 바랍니다.\n\n새해 복 많이 받으세요."
    }
  </script>
  <script>
    const byId = (id) => document.getElementById(id);
    const cover = byId('cover');
    const inside = byId('inside');
    const editor = byId('editor');
    const form = byId('editor-form');
    const status = byId('status');
    const data = byId('card-data');
    const initialMarkup = document.documentElement.outerHTML;
    let card = JSON.parse(data.textContent);

    function renderCard() {
      const recipient = (card.recipient || '소중한 당신') + '께';
      byId('envelope-recipient').textContent = recipient;
      byId('recipient').textContent = recipient;
      byId('letter-body').textContent = card.message;
      byId('sender').textContent = card.sender ? card.sender + ' 드림' : '고마운 마음을 담아';
    }

    function showLetter(open) {
      cover.hidden = open;
      inside.hidden = !open;
      byId(open ? 'letter' : 'open-button').focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }

    byId('open-button').addEventListener('click', () => showLetter(true));
    byId('close-button').addEventListener('click', () => showLetter(false));

    byId('edit-button').addEventListener('click', () => {
      form.elements.recipient.value = card.recipient;
      form.elements.sender.value = card.sender;
      form.elements.message.value = card.message;
      form.elements.message.setCustomValidity('');
      editor.showModal();
    });

    byId('cancel-button').addEventListener('click', () => editor.close());
    form.elements.message.addEventListener('input', () => {
      form.elements.message.setCustomValidity('');
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const message = form.elements.message.value.trim();
      if (!message) {
        form.elements.message.setCustomValidity('인사말을 입력해 주세요.');
        form.elements.message.reportValidity();
        return;
      }
      card = {
        recipient: form.elements.recipient.value.trim(),
        sender: form.elements.sender.value.trim(),
        message
      };
      renderCard();
      editor.close();
      showLetter(true);
      status.textContent = '카드에 적용했습니다.';
    });

    byId('download-button').addEventListener('click', () => {
      const saved = new DOMParser().parseFromString(initialMarkup, 'text/html');
      saved.getElementById('card-data').textContent = JSON.stringify(card).replace(/</g, '\\u003c');
      const file = new Blob(['<!doctype html>\n', saved.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(file);
      const link = document.createElement('a');
      link.href = url;
      link.download = '2026-연말-인사-카드.html';
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      status.textContent = '카드 파일을 저장했습니다.';
    });

    const snow = byId('snow');
    const flakes = document.createDocumentFragment();
    for (let index = 0; index < 44; index += 1) {
      const flake = document.createElement('i');
      flake.style.setProperty('--x', (index * 61.83 % 100) + '%');
      flake.style.setProperty('--size', (1 + index % 4 * .5) + 'px');
      flake.style.setProperty('--opacity', .24 + index % 6 * .1);
      flake.style.setProperty('--time', (16 + index % 11 * 1.77) + 's');
      flake.style.setProperty('--delay', (-index * 7.21 % 30) + 's');
      flake.style.setProperty('--drift', (10 + index % 8 * 7) + 'px');
      flakes.append(flake);
    }
    snow.append(flakes);
    byId('snow-button').addEventListener('click', () => {
      const paused = snow.dataset.paused !== 'true';
      snow.dataset.paused = String(paused);
      byId('snow-label').textContent = paused ? '눈 내리기' : '눈 멈추기';
    });

    renderCard();
  </script>
</body>
</html>
