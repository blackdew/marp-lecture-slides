<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f4eb">
<title>영희에게 · 서른 해의 봄</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f4eb;color:#354c43;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100svh;display:grid;place-items:center;padding:38px 20px}main{width:min(100%,820px);position:relative;background:#fffcf5;border:1px solid #deded0;box-shadow:0 22px 80px #43564712;padding:54px 58px 34px;text-align:center;overflow:hidden}main:before{content:"";position:absolute;inset:12px;border:1px solid #deded0;pointer-events:none}.eyebrow{font-size:14px;letter-spacing:.2em;color:#6e7f70;margin:0 0 32px}.to{font-size:18px;color:#8b706b;letter-spacing:.12em}h1{font-family:"Batang","AppleMyungjo",serif;font-weight:400;line-height:1.65;font-size:clamp(30px,5.4vw,46px);letter-spacing:-.04em;margin:18px 0 22px}.landscape{width:100%;height:auto;display:block;margin:8px auto 26px}.letter{font-family:"Batang","AppleMyungjo",serif;font-size:clamp(17px,2.7vw,20px);line-height:2.05;word-break:keep-all}.letter p{margin:0 0 18px}.closing{font-size:16px;line-height:1.9;color:#7e6963;margin-top:28px}.foot{border-top:1px solid #deded0;margin-top:34px;padding-top:20px;font-size:14px;letter-spacing:.12em;color:#748274}.flower{position:absolute;width:116px;height:150px;opacity:.85;pointer-events:none}.left{left:-24px;top:35px;transform:rotate(18deg)}.right{right:-24px;bottom:70px;transform:rotate(195deg)}@media(max-width:540px){body{padding:16px 12px}main{padding:44px 25px 30px}.eyebrow{font-size:12px;letter-spacing:.13em}.flower{width:80px}.letter br{display:none}h1{margin-top:20px}.landscape{margin:20px 0}}
@media print{body{padding:0;background:white}main{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<main aria-label="30년 친구 영희에게 보내는 인사 카드">
<svg class="flower left" viewBox="0 0 120 160" aria-hidden="true"><path d="M55 160Q85 95 50 25" fill="none" stroke="#8caa86" stroke-width="2"/><path d="M65 120Q14 116 30 89Q64 89 65 120M66 91Q111 91 100 64Q72 62 66 91" fill="#b8c9a3"/><g fill="#e8bfb7"><ellipse cx="49" cy="26" rx="13" ry="23"/><ellipse cx="49" cy="26" rx="13" ry="23" transform="rotate(60 49 26)"/><ellipse cx="49" cy="26" rx="13" ry="23" transform="rotate(120 49 26)"/></g><circle cx="49" cy="26" r="7" fill="#d6b774"/></svg>
<svg class="flower right" viewBox="0 0 120 160" aria-hidden="true"><path d="M55 160Q85 95 50 25" fill="none" stroke="#8caa86" stroke-width="2"/><path d="M65 120Q14 116 30 89Q64 89 65 120M66 91Q111 91 100 64Q72 62 66 91" fill="#b8c9a3"/><g fill="#e8bfb7"><ellipse cx="49" cy="26" rx="13" ry="23"/><ellipse cx="49" cy="26" rx="13" ry="23" transform="rotate(60 49 26)"/><ellipse cx="49" cy="26" rx="13" ry="23" transform="rotate(120 49 26)"/></g><circle cx="49" cy="26" r="7" fill="#d6b774"/></svg>
<p class="eyebrow">함께한 서른 해, 그리고 우리의 봄</p>
<p class="to">나의 오랜 친구, 영희에게</p>
<h1>오늘도 너의 하루가<br>따뜻하기를</h1>
<svg class="landscape" viewBox="0 0 700 220" role="img" aria-label="봄 안개와 꽃이 어우러진 지리산을 표현한 그림">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#edf0e5"/><stop offset="1" stop-color="#fffcf5"/></linearGradient><linearGradient id="mist" x2="0" y2="1"><stop stop-color="#fffcf5" stop-opacity="0"/><stop offset="1" stop-color="#fffcf5"/></linearGradient></defs>
<rect width="700" height="220" rx="100" fill="url(#sky)"/><circle cx="527" cy="47" r="24" fill="#ebd4af"/>
<path d="M0 143L80 104 136 122 241 43 292 90 338 73 406 114 468 60 545 111 604 83 700 139V220H0Z" fill="#c7d3c2"/>
<path d="M0 174L107 131 176 150 289 90 375 151 450 118 556 157 624 122 700 154V220H0Z" fill="#a4bca7"/>
<path d="M0 197Q98 144 188 178T354 171T542 180T700 164V220H0Z" fill="#7e9e8a"/>
<path d="M341 220Q370 189 347 177Q331 169 362 158" stroke="#e6dfbf" stroke-width="7" fill="none"/>
<rect width="700" height="220" fill="url(#mist)"/>
<g fill="#dcb6ae"><circle cx="90" cy="170" r="5"/><circle cx="104" cy="179" r="4"/><circle cx="81" cy="188" r="4"/><circle cx="602" cy="165" r="5"/><circle cx="614" cy="184" r="4"/><circle cx="586" cy="181" r="3"/></g>
</svg>
<div class="letter"><p>영희야, 30년을 함께해 줘서 고마워.</p><p>봄에 함께 걸었던 지리산처럼,<br>너와 쌓은 추억은 오래도록 따뜻해.</p><p>앞으로도 함께 웃으며<br>좋은 추억 많이 만들자.</p></div>
<p class="closing">작은 미소와 좋은 일들이<br>너의 하루에 가득하기를.</p>
<footer class="foot">지리산의 봄을 기억하며 · 너의 오랜 친구가</footer>
</main>
</body>
</html>
