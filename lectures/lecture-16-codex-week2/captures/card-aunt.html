<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcf8f3">
  <meta name="description" content="이모께 전하는 한 해의 감사와 새해 인사">
  <title>사랑하는 이모께</title>
  <style>
    * { box-sizing: border-box; }
    html { font-size: 100%; background: #eee5dc; }
    body { margin: 0; color: #302923; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main {
      width: min(100%, 30rem); min-height: 100svh; margin-inline: auto;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background: #fcf8f3; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: clamp(18px, 3.2svh, 30px);
      text-align: center; border-inline: 1px solid #e3d5c8;
    }
    .flower { width: 48px; height: 55px; flex: 0 0 auto; }
    h1 { font-size: clamp(1.75rem, 7.7vw, 2.25rem); line-height: 1.4; margin: 0; font-weight: 700; letter-spacing: -.04em; }
    p { font-size: clamp(1.75rem, 7.7vw, 2.25rem); line-height: 1.55; margin: 0; font-weight: 600; letter-spacing: -.045em; }
    .love { color: #783e46; }
    @media (max-height: 690px) {
      main { gap: 16px; padding-block: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-bottom)); }
      .flower { height: 35px; }
      h1, p { font-size: 1.75rem; line-height: 1.42; }
    }
    @media (prefers-contrast: more) { body { color: #000; } .love { color: #60212b; } }
  </style>
</head>
<body>
  <main aria-labelledby="greeting">
    <svg class="flower" viewBox="0 0 60 70" aria-hidden="true" focusable="false">
      <path d="M30 29 Q27 48 32 67 M30 53 Q13 52 14 41 Q26 42 30 53 M30 59 Q44 57 47 46 Q33 46 30 59" fill="#567552" stroke="#567552" stroke-width="2"/>
      <g fill="#b45d70">
        <ellipse cx="30" cy="14" rx="8" ry="12"/>
        <ellipse cx="41" cy="23" rx="12" ry="8" transform="rotate(-28 41 23)"/>
        <ellipse cx="37" cy="35" rx="8" ry="12" transform="rotate(-32 37 35)"/>
        <ellipse cx="23" cy="35" rx="8" ry="12" transform="rotate(32 23 35)"/>
        <ellipse cx="19" cy="23" rx="12" ry="8" transform="rotate(28 19 23)"/>
      </g>
      <circle cx="30" cy="26" r="6" fill="#f2d58d"/>
    </svg>
    <h1 id="greeting">사랑하는 이모께</h1>
    <p>올 한 해도<br>건강하게 지내 주셔서<br>고맙습니다.</p>
    <p>봄에 이모와 함께<br>벚꽃을 보았던 시간을<br>소중히 간직합니다.</p>
    <p>새해에도 건강하세요.<br><span class="love">사랑합니다, 이모.</span></p>
    <p>조카 올림</p>
  </main>
</body>
</html>
